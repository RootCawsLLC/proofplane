# Names transcribed from secondary documentation, not from the OWASP primary PDF. Two sources
# consulted agreed on all ten identifiers and differed on the exact wording of three titles
# (ASI03, ASI04, ASI08 — "Agent Identity…" vs "Identity…", "…Compromise" vs "…Vulnerabilities",
# "Cascading Agent Failures" vs "Cascading Failures"). The more specific wording is used here.
# The identifiers are what the crosswalk depends on and those are not in dispute.
#
# This file exists because three of these were mapped incorrectly in the first version of this
# catalog — ASI04 was recorded as "Sensitive Information Disclosure", ASI09 as "Insufficient
# Observability", and PP-C006 pointed at ASI10 instead of ASI04. Every one of those was a
# plausible-sounding guess. Making the threat catalog data, and validating control files
# against it, turns that class of error into a failing test instead of a confident footnote.
source_note: transcribed from secondary sources; not verified against the OWASP primary document

