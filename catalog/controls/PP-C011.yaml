    label: Accuracy, robustness and cybersecurity
    confidence: high
    basis: >
      Article 15 requires high-risk systems to be resilient against errors, faults and
      inconsistencies. Argument validation is squarely within that.
  - framework: ISO/IEC 42001:2023
    reference: A.6
    reference_kind: annex_a_group
    label: AI system lifecycle
    confidence: medium
    basis: Annex A group level only. Verification and validation of AI system behavior.
  - framework: NIST AI RMF 1.0
    reference: MEASURE-2.7
    reference_kind: subcategory
    confidence: low
    basis: Security and resilience evaluation. Approximate anchor.
  - framework: AIUC-1
    reference: Reliability
    reference_kind: domain
    confidence: high
    basis: Domain level only.

references:
  - https://artificialintelligenceact.eu/article/15/
