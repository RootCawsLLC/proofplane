    reference: A.10
    reference_kind: annex_a_group
    label: Third-party and customer relationships
    confidence: medium
    basis: >
      Annex A group level only. A plugin-supplied tool is a third-party component of the AI
      system.
  - framework: ISO/IEC 42001:2023
    reference: A.4
    reference_kind: annex_a_group
    label: Resources for AI systems
    confidence: low
    basis: Annex A group level only. Documenting what the system depends on.
  - framework: EU AI Act
    reference: Article 15
    reference_kind: article
    label: Accuracy, robustness and cybersecurity
    confidence: medium
    basis: >
      Article 15 requires resilience against attempts to alter system behaviour by exploiting
      vulnerabilities. An unscoped tool surface is such a vulnerability. Supporting.
  - framework: AIUC-1
    reference: Security
    reference_kind: domain
    confidence: high
    basis: Domain level only.
  - framework: ISO/IEC 27001:2022
    reference: A.8.19
    reference_kind: annex_a_control
    label: Installation of software on operational systems
    confidence: low
    basis: >
      Cited by analogy — an agent tool manifest is software installed on an operational system.
      The control number has not been verified against a licensed copy of the standard.

references:
  - https://artificialintelligenceact.eu/article/15/
